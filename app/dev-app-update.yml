# checks stay disabled in dev regardless (see the app.isPackaged guard in init.js) - this file exists
# so autoUpdater.getOrCreateDownloadHelper() can resolve the cache directory during dev testing.
# Mirrors resources/app-update.yml, which electron-builder generates for packaged builds.
