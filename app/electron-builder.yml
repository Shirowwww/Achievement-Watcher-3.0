appId: io.github.shirowwww.achievement.watcher
productName: 'Achievement Watcher'
npmRebuild: false

# Copies watchdog/node_modules into the packed app. electron-builder's
# extraFiles object form drops node_modules, which otherwise leaves the
# Watchdog unable to start after install (missing @xan105/log etc.).
afterPack: ./build/afterPack.js

# Overlay notification presets and sounds must live on disk (not inside app.asar) so the
# notification window can loadFile() preset HTML and play sound files via file:// URLs.
asarUnpack:
  - presets/**
  - sounds/**

publish:
  provider: github
  owner: Shirowwww
  repo: Achievement-Watcher-3.0

win:
  icon: build/icon.ico
  target: nsis
  artifactName: 'Achievement.Watcher.Setup.${version}.${ext}'
  # Code signing: no trusted certificate is configured. `npm run build`
  # signs automatically when app/build/signing/Shirow.pfx exists (created by
  # build/signing/create-self-signed-cert.ps1); otherwise the build stays
  # unsigned. The Windows publisher shown to the firewall is "Shirow"
  # (CompanyName metadata + certificate subject CN=Shirow).

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  displayLanguageSelector: false
  warningsAsErrors: false
  deleteAppDataOnUninstall: false
  # The installer UI follows the Windows display language (mapped in
  # build/installer.nsh). These languages match app/locale/lang/*.json.
  installerLanguages:
    - en_US
    - fr_FR
    - de_DE
    - es_ES
    - it_IT
    - pt_PT
    - pt_BR
    - cs_CZ
    - sk_SK
    - hu_HU
    - pl_PL
    - ru_RU
    - uk_UA
    - tr_TR
    - th_TH
    - ja_JP
    - zh_CN
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerIcon: build/icon.ico
  license: build/license.txt
  differentialPackage: true

directories:
  buildResources: ./build

files:
  - '**/*'
  - '!**/*.map'
  - '!dist/**'
  - '!buildme.cmd'
  - '!watchdog/_wip_/**'
  - '!watchdog/patches/**'

extraFiles:
  - from: ../watchdog
    to: ./watchdog
    filter:
      - '**/*'
      - '!watchdog/_wip_/**'
      - '!watchdog/patches/**'

  # NOTE: the portable node/ (Node 14) is gone since the A2 koffi migration — the monitor now runs
  # under Electron's own Node via ELECTRON_RUN_AS_NODE (see launchWatchdog in electron/init.js).

  - from: ./media
    to: resources/userData/Media

  - from: ./Source
    to: resources/userData/Source

  - from: ./view
    to: resources/userData/view
