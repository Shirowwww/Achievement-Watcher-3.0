<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Modern Achievement Popup</title>
  <meta name="duration" content="5000" />
  <meta width="450" height="150">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      transform-origin: center center;
    }

    /* Container that adapts to scaling */
    .achievement-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Target the root container when scaling */
    body[data-scaled="true"] .achievement-container {
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="achievement-container">
    <div class="achievement">
      <div class="achievement-content">
        <div class="icon-container">
          <img src="" alt="Achievement Icon" class="achievement-icon">
        </div>
        <div class="text-container">
          <h3 class="achievement-title"></h3>
          <p class="achievement-description"></p>
          <div class="progress_line" hidden>
            <span class="progress_track"><span class="progress_meter"></span></span>
            <span class="progress_label"></span>
          </div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const metaDur = document.querySelector('meta[name="duration"]');
      function notifyScreenshotReady(delayMs = 0) {
        const safeDelay = Math.max(0, Number(delayMs) || 0);
        setTimeout(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.api?.notificationRenderReady?.();
            });
          });
        }, safeDelay);
      }
      function applyRarityTier(rootEl, value) {
        rootEl?.classList.remove("rarity-gold", "rarity-silver", "rarity-bronze");
        if (value == null || value === "") return;
        const percent = Number(value);
        if (!Number.isFinite(percent) || percent < 0 || percent > 10) return;
        if (percent < 3) rootEl.classList.add("rarity-gold");
        else if (percent < 6) rootEl.classList.add("rarity-silver");
        else rootEl.classList.add("rarity-bronze");
      }
      function normalizeProgress(data) {
        const src = data?.progress || data || {};
        const max = Number(src.max ?? src.progressMax);
        if (!Number.isFinite(max) || max <= 1) return null;
        const currentRaw = Number(src.current ?? src.progressCurrent);
        const current = Math.max(
          0,
          Math.min(max, Number.isFinite(currentRaw) ? currentRaw : 0)
        );
        const percentRaw = Number(src.percent ?? src.progressPercent);
        const percent = Number.isFinite(percentRaw)
          ? Math.max(0, Math.min(100, Math.floor(percentRaw)))
          : Math.max(0, Math.min(100, Math.floor((current / max) * 100)));
        return { current, max, percent };
      }
      function applyProgress(data) {
        const progress = normalizeProgress(data);
        const line = document.querySelector(".progress_line");
        const meter = document.querySelector(".progress_meter");
        const label = document.querySelector(".progress_label");
        if (!line || !meter || !label) return;
        if (!progress) {
          line.hidden = true;
          meter.style.width = "0%";
          label.textContent = "";
          return;
        }
        line.hidden = false;
        meter.style.width = `${progress.percent}%`;
        label.textContent = `${progress.current}/${progress.max} - ${progress.percent}%`;
      }
      function startMarqueeIfOverflow(lineEl) {
        try {
          lineEl.getAnimations().forEach((a) => a.cancel());
        } catch {}
        lineEl.classList.remove("marquee");
        void lineEl.offsetWidth;
        const clip = lineEl.closest(".text-container") || lineEl;
        const overflow = Math.round((lineEl.scrollWidth || 0) - (clip.clientWidth || 0));
        if (overflow > 2) {
          const px = Math.ceil(overflow + 24);
          lineEl.classList.add("marquee");
          lineEl.animate(
            [
              { transform: "translateX(0)" },
              { transform: `translateX(-${px}px)` },
            ],
            {
              duration: Math.max(3000, Math.round(px / 50) * 1000),
              delay: 1000,
              easing: "linear",
              fill: "both",
            }
          );
        }
      }
      window.api.onNotification((notificationData) => {
        const titleEl = document.querySelector(".achievement-title");
        const descEl = document.querySelector(".achievement-description");
        const iconEl = document.querySelector(".achievement-icon");
        const card = document.querySelector(".achievement");
        if (notificationData) {
          if (notificationData.displayName != null) titleEl.textContent = notificationData.displayName;
          if (notificationData.description != null) descEl.textContent = notificationData.description;
          const rawIcon = notificationData.iconPath || notificationData.icon;
          if (rawIcon) {
            const p = String(rawIcon).replace(/\\/g, "/");
            iconEl.src = p.startsWith("file://") ? p : `file:///${p}`;
          }
          // Apply scaling with proper container adjustments
          const root = document.body;
          const scale = Math.max(0.01, parseFloat(notificationData.scale || 1) || 1);
          root.style.transform = `scale(${scale})`;
          // Set data attribute for targeted CSS at different scales
          if (scale > 1) root.setAttribute("data-scaled", "true");
          else root.removeAttribute("data-scaled");
          applyRarityTier(card, notificationData.rarityPercent);
          applyProgress(notificationData);
        }

        const total = Math.max(0, Number(metaDur?.content || 5000));
        document.documentElement.style.setProperty(
          "--animation-duration",
          `${total}ms`
        );
        card.classList.add("active");
        notifyScreenshotReady(560);
        requestAnimationFrame(() => {
          startMarqueeIfOverflow(titleEl);
          startMarqueeIfOverflow(descEl);
        });
        setTimeout(() => {
          card.classList.remove("active");
          window.api.closeNotificationWindow();
        }, total);
      });
    });
  </script>
</body>
</html>
