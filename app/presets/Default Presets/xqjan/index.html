<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xqjan Morphing Animation</title>
  <meta name="duration" content="10000" />
  <meta width="450" height="150">
  <style>
    :root {
      --bg-color: #222;
      --primary: #00aced;
      --wave-color-1: #203e7a;
      --wave-color-2: #0c2a66;
	  --wave-color-3: #ffffff;
      --timeline-scale: 1;
    }
	html {
	  overflow: hidden;
	  scrollbar-width: none;
	}
	.scroll-container {
		max-height: 80vh;
		overflow-y: scroll; 
		scrollbar-width: none; 
		-ms-overflow-style: none;
	}
	html, body {
	  margin: 0;
	  padding: 0;
	  height: 100%;
	  background: transparent;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  font-family: sans-serif;
	  overflow: visible;           
	  scrollbar-width: none;       
	}

	body::-webkit-scrollbar {
	  display: none;                
	}
	body {
	  overscroll-behavior: none;
	}

    .notification {
      position: relative;
      background: rgba(34, 34, 34, 0.85);
      border-radius: 50%;
      width: 80px;
      height: 80px;
      overflow: visible;
      animation: popIn calc(0.5s * var(--timeline-scale)) ease-out forwards,
                 expandCircle calc(0.6s * var(--timeline-scale)) ease-out calc(1.5s * var(--timeline-scale)) forwards,
                 retractCircle calc(0.4s * var(--timeline-scale)) ease-in calc(5.5s * var(--timeline-scale)) forwards,
                 popOut calc(0.5s * var(--timeline-scale)) ease-in calc(7s * var(--timeline-scale)) forwards;
    }

    .loader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      animation: showWave calc(0.5s * var(--timeline-scale)) ease-in calc(0.2s * var(--timeline-scale)) forwards,
                 hideWave calc(0.2s * var(--timeline-scale)) ease-out calc(1.2s * var(--timeline-scale)) forwards,
                 showWave calc(0.5s * var(--timeline-scale)) ease-in calc(6s * var(--timeline-scale)) forwards,
                 hideWave calc(0.2s * var(--timeline-scale)) ease-out calc(7s * var(--timeline-scale)) forwards;
    }

    .achievement-loader {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: waveEffect calc(1.5s * var(--timeline-scale)) infinite ease-out;
      opacity: 0.3;
    }

    .achievement-loader:nth-child(1) {
      background-color: var(--wave-color-1);
    }

    .achievement-loader:nth-child(2) {
      background-color: var(--wave-color-2);
      animation-delay: calc(0.3s * var(--timeline-scale));
    }

    .achievement-loader:nth-child(3) {
      background-color: var(--wave-color-3);
      animation-delay: calc(0.5s * var(--timeline-scale));
    }

    @keyframes waveEffect {
      0%   { transform: scale(0.9); opacity: 0.4; }
      50%  { transform: scale(1.2); opacity: 0.1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes showWave {
      to { opacity: 1; }
    }

    @keyframes hideWave {
      to { opacity: 0; }
    }

    .icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b3b3b 0%, #6b6b6b 100%) center/cover no-repeat;
      border-radius: 50%;
      z-index: 2;
      animation: iconPopIn calc(0.5s * var(--timeline-scale)) ease-out 0s forwards,
                 iconPopOut calc(0.5s * var(--timeline-scale)) ease-in calc(1.5s * var(--timeline-scale)) forwards,
                 iconPopIn calc(0.5s * var(--timeline-scale)) ease-out calc(5.5s * var(--timeline-scale)) forwards,
                 iconPopOut calc(0.5s * var(--timeline-scale)) ease-in calc(7s * var(--timeline-scale)) forwards;
      opacity: 0;
    }
	
.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  opacity: 1;
  transition: opacity 0.3s ease;
}

.notification.expanded .icon img {
  opacity: 0;
}

@keyframes iconPopIn {
  0%   { transform: translate(-50%, -50%) scale(0);     opacity: 0; }
  60%  { transform: translate(-50%, -50%) scale(1.3);   opacity: 1; }
  80%  { transform: translate(-50%, -50%) scale(0.95);  }
  100% { transform: translate(-50%, -50%) scale(1);     opacity: 1; }
}

@keyframes iconPopOut {
  0%   { transform: translate(-50%, -50%) scale(1);     opacity: 1; }
  30%  { transform: translate(-50%, -50%) scale(1.2);   }
  100% { transform: translate(-50%, -50%) scale(0);     opacity: 0; }
}


    .text {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transform: translateY(0%) scale(0.8);
      opacity: 0;
      z-index: 1;
      animation: showText calc(0.5s * var(--timeline-scale)) ease-out calc(2s * var(--timeline-scale)) forwards,
                 hideText calc(0.5s * var(--timeline-scale)) ease-in calc(4.8s * var(--timeline-scale)) forwards;
    }

    .title {
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
    }

    .desc {
      font-size: 0.90rem;
      color: #ccc;
    }

@keyframes popIn {
  0%   { transform: scale(0);     opacity: 0; }
  60%  { transform: scale(1.2);   opacity: 1; }
  80%  { transform: scale(0.95);  }
  100% { transform: scale(1);     opacity: 1; }
}

    @keyframes expandCircle {
      to {
        width: 420px;
        height: 90px;
        border-radius: 12px;
      }
    }

    @keyframes retractCircle {
      to {
        width: 80px;
        height: 80px;
        border-radius: 50%;
      }
    }

@keyframes popOut {
  0%   { transform: scale(1);     opacity: 1; }
  30%  { transform: scale(1.1);   }
  100% { transform: scale(0);     opacity: 0; }
}

    @keyframes showText {
      to { opacity: 1; transform: translateY(0%) scale(1); }
    }

    @keyframes hideText {
      to { opacity: 0; transform: translateY(0%) scale(0.6); }
    }

    /* AW deep pass: rarity + progress */
    .notification {
      --aw-accent: #00aced;
      --aw-accent-soft: #66d3ff;
      --aw-glow: rgba(0, 172, 237, 0.5);
    }
    .notification.rarity-gold {
      --aw-accent: #ffd24e;
      --aw-accent-soft: #fff0a8;
      --aw-glow: rgba(255, 216, 72, 0.55);
    }
    .notification.rarity-silver {
      --aw-accent: #9fb2cc;
      --aw-accent-soft: #eef4fb;
      --aw-glow: rgba(195, 216, 242, 0.5);
    }
    .notification.rarity-bronze {
      --aw-accent: #cd7f32;
      --aw-accent-soft: #f0bd91;
      --aw-glow: rgba(205, 111, 41, 0.5);
    }
    .progress_line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      min-width: 0;
      width: 200px;
    }
    .progress_line[hidden] {
      display: none;
    }
    .progress_track {
      display: block;
      flex: 1 1 auto;
      min-width: 60px;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .progress_meter {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--aw-accent) 0%, var(--aw-accent-soft) 100%);
      box-shadow: 0 0 12px var(--aw-glow);
      transition: width 0.35s ease;
    }
    .progress_label {
      flex: 0 0 auto;
      max-width: 110px;
      overflow: hidden;
      color: #f3f7ff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="notification">
    <div class="loader-wrapper">
      <div class="achievement-loader"></div>
      <div class="achievement-loader"></div>
      <div class="achievement-loader"></div>
    </div>
	<div class="icon">
	  <img src="" alt="Icon">
	</div>
    <div class="text">
      <div class="title"></div>
      <div class="desc"></div>
      <div class="progress_line" hidden>
        <span class="progress_track"><span class="progress_meter"></span></span>
        <span class="progress_label"></span>
      </div>
    </div>
  </div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const metaDur = document.querySelector('meta[name="duration"]');
  const baseTotal = Math.max(1, Number(metaDur?.content || 10000));
  function notifyScreenshotReady(delayMs = 0) {
    const safeDelay = Math.max(0, Number(delayMs) || 0);
    setTimeout(() => {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.api?.notificationRenderReady?.();
        });
      });
    }, safeDelay);
  }
  function applyRarityTier(rootEl, value) {
    rootEl?.classList.remove("rarity-gold", "rarity-silver", "rarity-bronze");
    if (value == null || value === "") return;
    const percent = Number(value);
    if (!Number.isFinite(percent) || percent < 0 || percent > 10) return;
    if (percent < 3) rootEl.classList.add("rarity-gold");
    else if (percent < 6) rootEl.classList.add("rarity-silver");
    else rootEl.classList.add("rarity-bronze");
  }
  function normalizeProgress(data) {
    const src = data?.progress || data || {};
    const max = Number(src.max ?? src.progressMax);
    if (!Number.isFinite(max) || max <= 1) return null;
    const currentRaw = Number(src.current ?? src.progressCurrent);
    const current = Math.max(
      0,
      Math.min(max, Number.isFinite(currentRaw) ? currentRaw : 0)
    );
    const percentRaw = Number(src.percent ?? src.progressPercent);
    const percent = Number.isFinite(percentRaw)
      ? Math.max(0, Math.min(100, Math.floor(percentRaw)))
      : Math.max(0, Math.min(100, Math.floor((current / max) * 100)));
    return { current, max, percent };
  }
  function applyProgress(data) {
    const progress = normalizeProgress(data);
    const line = document.querySelector(".progress_line");
    const meter = document.querySelector(".progress_meter");
    const label = document.querySelector(".progress_label");
    if (!line || !meter || !label) return;
    if (!progress) {
      line.hidden = true;
      meter.style.width = "0%";
      label.textContent = "";
      return;
    }
    line.hidden = false;
    meter.style.width = `${progress.percent}%`;
    label.textContent = `${progress.current}/${progress.max} - ${progress.percent}%`;
  }
  window.api?.onNotification?.((notificationData) => {
    const notificationEl = document.querySelector(".notification");
    if (notificationData) {
      if (notificationData.displayName != null) {
        document.querySelector(".title").textContent = notificationData.displayName;
      }
      if (notificationData.description != null) {
        document.querySelector(".desc").textContent = notificationData.description;
      }
      if (notificationData.iconPath) {
        document.querySelector(".icon img").src = `file:///${notificationData.iconPath}`;
      }
      applyRarityTier(notificationEl, notificationData.rarityPercent);
      applyProgress(notificationData);

      const total = Math.max(0, Number(metaDur?.content || 10000));
      const timelineScale = Math.max(0.1, total / baseTotal);
      document.documentElement.style.setProperty(
        "--timeline-scale",
        timelineScale.toFixed(4)
      );
      notifyScreenshotReady(Math.max(700, Math.round(2100 * timelineScale)));

      const root = document.body;
      const scale = parseFloat(notificationData.scale || 1);
      root.style.transform = `scale(${scale})`;
      root.style.transformOrigin = 'center center';
    }
  });
});
</script>

</body>
</html>
