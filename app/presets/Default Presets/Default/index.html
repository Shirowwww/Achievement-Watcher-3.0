<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Popup Animation</title>
    <meta name="duration" content="6000" />
    <meta width="450" height="115" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      body {
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <div class="ach">
      <div class="icon"><img src="" alt="Icon" /></div>
      <div class="text_wrap">
        <p class="title"></p>
        <span class="detail"></span>
        <div class="progress_line" hidden>
          <span class="progress_track"><span class="progress_meter"></span></span>
          <span class="progress_label"></span>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const metaDur = document.querySelector('meta[name="duration"]');

        function startMarqueeIfOverflow(lineEl, { innerSelector = null } = {}) {
          try {
            lineEl.getAnimations().forEach((a) => a.cancel());
          } catch {}
          lineEl.classList.remove("marquee");
          void lineEl.offsetWidth;
          const clip = lineEl.closest(".text_wrap") || lineEl;
          const overflow = Math.round(
            (lineEl.scrollWidth || 0) - (clip.clientWidth || 0)
          );
          const overflowY = Math.round(
            (lineEl.scrollHeight || 0) - (lineEl.clientHeight || 0)
          );
          if (overflow > 2 || overflowY > 1) {
            const px = Math.ceil(Math.max(overflow, overflowY) + 24);
            lineEl.classList.add("marquee");
            lineEl.animate(
              [
                { transform: "translateX(0)" },
                { transform: `translateX(-${px}px)` },
              ],
              {
                duration: Math.max(3000, Math.round(px / 50) * 1000),
                delay: 1000,
                easing: "linear",
                fill: "both",
              }
            );
          }
        }

        function applyRarityTier(rootEl, value) {
          rootEl?.classList.remove("rarity-gold", "rarity-silver", "rarity-bronze");
          if (value == null || value === "") return;
          const percent = Number(value);
          if (!Number.isFinite(percent) || percent < 0 || percent > 10) return;
          if (percent < 3) rootEl.classList.add("rarity-gold");
          else if (percent < 6) rootEl.classList.add("rarity-silver");
          else rootEl.classList.add("rarity-bronze");
        }

        function normalizeProgress(data) {
          const src = data?.progress || data || {};
          const max = Number(src.max ?? src.progressMax);
          if (!Number.isFinite(max) || max <= 1) return null;
          const currentRaw = Number(src.current ?? src.progressCurrent);
          const current = Math.max(
            0,
            Math.min(max, Number.isFinite(currentRaw) ? currentRaw : 0)
          );
          const percentRaw = Number(src.percent ?? src.progressPercent);
          const percent = Number.isFinite(percentRaw)
            ? Math.max(0, Math.min(100, Math.floor(percentRaw)))
            : Math.max(0, Math.min(100, Math.floor((current / max) * 100)));
          return { current, max, percent };
        }

        function applyProgress(data) {
          const progress = normalizeProgress(data);
          const line = document.querySelector(".progress_line");
          const meter = document.querySelector(".progress_meter");
          const label = document.querySelector(".progress_label");
          if (!line || !meter || !label) return;
          if (!progress) {
            line.hidden = true;
            meter.style.width = "0%";
            label.textContent = "";
            return;
          }
          line.hidden = false;
          meter.style.width = `${progress.percent}%`;
          label.textContent = `${progress.current}/${progress.max} - ${progress.percent}%`;
        }

        function applyAnchoringFromPosition(ach, posRaw) {
          const raw = String(posRaw || "").toLowerCase();
          const tokens = raw
            .replace(/[^a-z]+/g, " ")
            .trim()
            .split(/\s+/)
            .filter(Boolean);
          let isTop = tokens.includes("top") || tokens.includes("t");
          let isBottom = tokens.includes("bottom") || tokens.includes("b");
          if (!isTop && !isBottom) {
            try {
              const y = (window.screenY ?? window.screenTop ?? 0) | 0;
              const sh = (screen.availHeight || screen.height || 1080) | 0;
              const wh = (window.outerHeight || window.innerHeight || 0) | 0;
              const centerY = y + wh / 2;
              isTop = centerY < sh / 2;
              isBottom = !isTop;
            } catch {}
          }
          ach.classList.remove("anchor-top", "anchor-bottom");
          ach.classList.add(isTop ? "anchor-top" : "anchor-bottom");
        }

        const baseTotal = Math.max(1, Number(metaDur?.content || 6000));
        function notifyScreenshotReady(delayMs = 0) {
          const safeDelay = Math.max(0, Number(delayMs) || 0);
          setTimeout(() => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                window.api?.notificationRenderReady?.();
              });
            });
          }, safeDelay);
        }

        function onPayload(displayName, description, iconPath, scale, data = {}) {
          const ach = document.querySelector(".ach");
          const titleEl = document.querySelector(".title");
          const detailEl = document.querySelector(".detail");
          const iconEl = document.querySelector(".icon img");

          if (displayName != null) titleEl.textContent = displayName;
          if (description != null) detailEl.textContent = description;
          if (iconPath) {
            const p = String(iconPath);
            const normalized = p.replace(/\\/g, "/");
            iconEl.src = normalized.startsWith("file://")
              ? normalized
              : `file:///${normalized}`;
          }

          const s = Math.max(0.01, parseFloat(scale || 1) || 1);
          ach.style.setProperty("--scale", String(s));
          applyRarityTier(ach, data?.rarityPercent);
          applyProgress(data);
          applyAnchoringFromPosition(ach, data?.position ?? data?.presetPosition ?? data?.pos ?? data?.corner ?? "");
          const total = Math.max(0, Number(metaDur?.content || baseTotal));
          const timelineScale = Math.max(0.1, total / baseTotal);
          const inMs = Math.max(120, Math.round(1400 * timelineScale));
          const outMs = Math.max(120, Math.round(400 * timelineScale));
          const holdMs = Math.max(0, total - inMs - outMs);
          ach.style.setProperty("--ach-in", `${inMs}ms`);
          ach.style.setProperty("--ach-hold", `${holdMs}ms`);
          ach.style.setProperty("--ach-out", `${outMs}ms`);

          // Start expand
          ach.classList.add("active");
          notifyScreenshotReady(inMs + 80);
          // After expand finishes (Default uses ~1.3s), measure + start marquee if needed
          setTimeout(() => {
            startMarqueeIfOverflow(titleEl);
            startMarqueeIfOverflow(detailEl);
            // small retry in case layout shifts
            setTimeout(() => {
              startMarqueeIfOverflow(titleEl);
              startMarqueeIfOverflow(detailEl);
            }, 350);
          }, 900);

          setTimeout(() => {
            ach.classList.remove("active");
            window.api?.closeNotificationWindow?.();
          }, total);
        }

        // API path
        window.api?.onNotification?.((data) =>
          onPayload(
            data?.displayName,
            data?.description,
            data?.iconPath || data?.icon,
            data?.scale,
            data
          )
        );

        // Legacy electronAPI path
        window.electronAPI?.onNotification?.((data) =>
          onPayload(
            data?.displayName,
            data?.description,
            data?.icon || data?.iconPath,
            data?.scale,
            data
          )
        );
      });
    </script>
  </body>
</html>
